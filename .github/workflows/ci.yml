name: KiranaVaani CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg

jobs:
  backend-tests:
    name: Backend Pytest & Noise Lab (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (libsndfile & ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 libsndfile1-dev ffmpeg

      - name: Upgrade Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt -r requirements-eval.txt

      - name: Run Pytest Suite
        run: |
          python -m pytest backend/tests -v --tb=short

      - name: Generate Synthetic Benchmark Utterances (80 samples)
        run: |
          python scripts/generate_synthetic_80.py

      - name: Run Noise Lab Evaluation & Ablation Benchmark
        run: |
          python -m noise_lab.evaluate_asr
          python -m noise_lab.evaluate_orders
          python scripts/run_ablation_benchmark.py
          python -m noise_lab.visualize_results

      - name: Verify Audio Pipeline & Benchmark Scripts
        run: |
          python scripts/test_audio_pipeline.py
          python scripts/test_live_render.py --help

      - name: Upload Benchmark & Visualization Artifacts (Python 3.12 Only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            reports/
            noise_lab/results/
          if-no-files-found: warn

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Verify Built SPA Distribution
        run: |
          test -f frontend/dist/index.html || { echo "Frontend build failed: index.html missing"; exit 1; }

  ci-success:
    name: All Quality Gates Passed
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "CI quality gates failed."
            exit 1
          fi
          echo "All backend test matrices and frontend build gates passed cleanly!"
