[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiranavaani"
version = "2.0.0"
description = "Noise-robust Hinglish grocery voice assistant using speech AI, NLP, catalogue matching, and audio evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "KiranaVaani Engineering Team", email = "dev@kiranavaani.ai" }
]
keywords = [
    "voice-assistant",
    "speech-recognition",
    "hinglish",
    "gnani-ai",
    "prisma",
    "timbre",
    "telephony-noise-lab",
    "kirana-store",
    "rapidfuzz"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "jiwer>=3.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "noise_lab*", "api*"]
exclude = ["frontend*", "docs*", "assets*", "data*", "reports*", "catalog*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
